name: Matrix

# Real scaffold + install + build + lint + test per combination (test/matrix/combinations.ts).
# Runs on PRs touching the scaffolder or templates, on demand, and from release.yml (tags).
on:
  pull_request:
    paths:
      - "src/**"
      - "templates/**"
      - "test/matrix/**"
      - ".github/workflows/matrix.yml"
  workflow_dispatch:
    inputs:
      combos:
        description: "Comma-separated combo ids (empty = all)"
        required: false
        default: ""
  workflow_call:

permissions:
  contents: read

env:
  # Package-manager versions used by the matrix. Keep in sync with what users are expected to run.
  PNPM_VERSION: "12.15.0"
  YARN_VERSION: "4.18.1"
  BUN_VERSION: "1.4.4"
  COREPACK_VERSION: "0.36.0"
  # Playwright version pinned by templates/addons/storybook/layer.json.
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  list:
    name: List combinations
    runs-on: ubuntu-latest
    outputs:
      combos: ${{ steps.list.outputs.combos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
      - id: list
        env:
          FILTER: ${{ inputs.combos }}
        run: |
          node --input-type=module -e '
            const { combos } = await import("./test/matrix/combinations.ts");
            const filter = (process.env.FILTER ?? "").split(",").map((s) => s.trim()).filter(Boolean);
            const picked = combos.filter((c) => filter.length === 0 || filter.includes(c.id));
            if (picked.length === 0) throw new Error(`no combos match ${process.env.FILTER}`);
            const rows = picked.map((c) => ({ id: c.id, pm: c.pm, type: c.selections.type }));
            console.log(`combos=${JSON.stringify(rows)}`);
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  combo:
    name: ${{ matrix.combo.id }} (${{ matrix.combo.pm }})
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.list.outputs.combos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: npm

      - name: Set up pnpm
        if: matrix.combo.pm == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up yarn
        if: matrix.combo.pm == 'yarn'
        run: |
          npm install -g "corepack@${COREPACK_VERSION}"
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate
          echo "COREPACK_ENABLE_DOWNLOAD_PROMPT=0" >> "$GITHUB_ENV"
          yarn --version
      - name: Set up bun
        if: matrix.combo.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Package-manager cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.local/share/pnpm/store
            ~/.cache/pnpm
            ~/.yarn/berry/cache
            ~/.bun/install/cache
          key: pm-${{ matrix.combo.pm }}-${{ matrix.combo.id }}-${{ hashFiles('templates/**/layer.json') }}
          restore-keys: |
            pm-${{ matrix.combo.pm }}-${{ matrix.combo.id }}-
            pm-${{ matrix.combo.pm }}-

      - name: Playwright browsers cache
        if: matrix.combo.type == 'library'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}
      - name: Playwright system dependencies
        if: matrix.combo.type == 'library'
        run: npx --yes "playwright@${PLAYWRIGHT_VERSION}" install-deps chromium

      - run: git config --global user.email "ci@bonesmith.invalid" && git config --global user.name "bonesmith CI"
      - run: npm ci
      - run: npm run build
      - name: Matrix
        env:
          MATRIX_COMBO: ${{ matrix.combo.id }}
        run: npm run test:matrix

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-log-${{ matrix.combo.id }}
          path: matrix-logs/
          retention-days: 14
